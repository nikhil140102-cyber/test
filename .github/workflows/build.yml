# Builds this app in the cloud on every push. Generated by App Builder.
# Results: "Releases" (Android APK download) and, if GitHub Pages is on, the website.
name: Build app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android, iOS and web folders (first build only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.avadhesh --project-name test --platforms android,ios,web .
          fi

      - name: Download packages
        run: flutter pub get 2>&1 | tee -a build-log.txt

      - name: Prepare Android settings
        run: dart tool/prepare_android.dart 2>&1 | tee -a build-log.txt

      - name: Automatic checks
        run: flutter test
        continue-on-error: true

      - name: Build Android app (APK)
        run: flutter build apk --release 2>&1 | tee -a build-log.txt

      - name: Build website
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" 2>&1 | tee -a build-log.txt

      - name: Show the error on the Summary page
        if: failure()
        run: |
          {
            echo '## The build failed'
            echo 'Copy everything in the box below and send it for help.'
            echo '```'
            grep -iE 'error|exception|failed|what went wrong|lib/.*dart:' build-log.txt | grep -v 'continue-on-error' | tail -n 40 || true
            echo '----- last lines -----'
            tail -n 40 build-log.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Android app built from ${{ github.sha }}. Download app-release.apk and open it on an Android phone.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true

      - name: Check GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload website
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publish-website:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
